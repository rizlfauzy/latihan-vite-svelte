<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <pattern id="nb-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#000000" opacity="0.15" />
    </pattern>
    <pattern id="nb-stripes" width="20" height="20" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#000000" stroke-width="4" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="240" fill="#FFE500" />
  <rect width="600" height="240" fill="url(#nb-dots)" />

  <!-- Neo-Brutalism Geometric Blocks -->
  <!-- Block 1: Pink Accent -->
  <rect x="-20" y="140" width="180" height="120" fill="#FF5E7E" stroke="#000000" stroke-width="4" transform="rotate(-6 70 200)" />
  <rect x="-20" y="140" width="180" height="120" fill="url(#nb-stripes)" transform="rotate(-6 70 200)" />

  <!-- Block 2: Cyan Box -->
  <rect x="460" y="-30" width="160" height="150" fill="#4DEEEA" stroke="#000000" stroke-width="4" transform="rotate(8 540 45)" />

  <!-- Block 3: Green Corner Accent -->
  <rect x="480" y="160" width="140" height="100" fill="#74EE15" stroke="#000000" stroke-width="4" transform="rotate(-4 550 210)" />

  <!-- Central Neo Brutalism Badge -->
  <g transform="translate(300, 115)">
    <!-- Shadow -->
    <rect x="-185" y="-45" width="370" height="90" rx="8" fill="#000000" />
    <!-- Main Card -->
    <rect x="-190" y="-50" width="370" height="90" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="4" />

    <!-- Sparkle Stars -->
    <path d="M -165 -25 L -160 -15 L -150 -10 L -160 -5 L -165 5 L -170 -5 L -180 -10 L -170 -15 Z" fill="#FFE500" stroke="#000000" stroke-width="2" />
    <path d="M 165 20 L 168 26 L 174 29 L 168 32 L 165 38 L 162 32 L 156 29 L 162 26 Z" fill="#FF5E7E" stroke="#000000" stroke-width="2" />

    <!-- Text -->
    <text x="0" y="-12" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#000000" text-anchor="middle" letter-spacing="1">⚡ APPS HUB PORTAL</text>
    <rect x="-140" y="6" width="280" height="24" rx="4" fill="#4DEEEA" stroke="#000000" stroke-width="2" />
    <text x="0" y="23" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#000000" text-anchor="middle" letter-spacing="2">CV SUKSES GEMILANG</text>
  </g>
</svg>
