stages:
  - test
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

variables:
  BUN_INSTALL: "/root/.bun"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - node_modules/
    - /root/.bun/install/cache/

# ==========================================
# 1. Test Stage (Playwright E2E & TypeCheck)
# ==========================================
test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.63.0-jammy
  before_script:
    - npm install -g bun
    - bun install --frozen-lockfile
  script:
    - bun run check
    - bun run test
  artifacts:
    when: always
    paths:
      - playwright-report/
    expire_in: 3 days

# ==========================================
# 2. Build Stage (Vite Production Bundle)
# ==========================================
build:
  stage: build
  image: oven/bun:1-alpine
  before_script:
    - bun install --frozen-lockfile
  script:
    - echo "$ENV" > .env.production
    - bun run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# ==========================================
# 3. Deploy Stage (Rsync via SSH to VPS)
# ==========================================
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -p "$VPS_PORT" "$VPS_IP" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - rsync -avz --delete -e "ssh -p $VPS_PORT -o StrictHostKeyChecking=no" dist/ $VPS_USER@$VPS_IP:$APPLICATION_PATH/
    - ssh -p $VPS_PORT -o StrictHostKeyChecking=no $VPS_USER@$VPS_IP "chmod -R 755 $APPLICATION_PATH"
